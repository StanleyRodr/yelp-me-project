<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YelpMe | Panel de administración</title>
    <script>
      // Tema antes de pintar (evita el destello claro). La lógica completa está en src/composables/useTema.js.
      ;(function () {
        var t = 'sistema'
        try { t = localStorage.getItem('ym_tema') || 'sistema' } catch (e) {}
        var oscuro = t === 'oscuro' || (t !== 'claro' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = document.documentElement.dataset.bsTheme = oscuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
